<!DOCTYPE html>
<html>
<head>
    <title>Car Object</title>
</head>

<body>

<script>
    let car = {
        brand: "Toyota",
        model: "Fortuner",
        year: 2024,

        displayDetails: function() {
            document.write("Brand: " + this.brand + "<br>");
            document.write("Model: " + this.model + "<br>");
            document.write("Year: " + this.year);
        }
    };

    car.displayDetails();
</script>

</body>
</html>
